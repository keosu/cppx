name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Code formatting check on Linux (lightweight, no build required)
  code-format:
    name: Code Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check code formatting
      uses: DoozyX/clang-format-lint-action@v0.18
      with:
        source: 'src tests examples'
        extensions: 'cpp,cppm,h'
        clangFormatVersion: 18
        style: file  # 使用 .clang-format 配置

  # Linux/macOS support and toolchain validation are tracked in docs/ROADMAP.md.
  build-windows:
    name: Windows - MSVC - ${{ matrix.mode }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    
    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: '3.1.1'
    
    - name: Configure
      run: xmake f -c -p windows -a x64 -m ${{ matrix.mode }} -y -v
    
    - name: Build library, tests and examples
      run: xmake build -j 2 -v
    
    - name: Run tests
      run: xmake test -v

    - name: Check toolchain capabilities
      if: matrix.mode == 'release'
      run: xmake check-toolchain --toolchain=msvc --require=all

    - name: Verify xmake consumers
      run: xmake verify-consumer --mode=${{ matrix.mode }}

    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-verification-${{ matrix.mode }}
        path: |
          build/toolchain-check/**/*.json
          build/toolchain-check/**/*.log
          build/consumer-check/**/*.json
          build/consumer-check/**/*.log
        if-no-files-found: warn

  toolchain-probes:
    name: Probe - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux-clang18-libcxx
          os: ubuntu-24.04
          packages: clang-18 libc++-18-dev libc++abi-18-dev
          arguments: --toolchain=clang --sdk=/usr/lib/llvm-18 --runtimes=c++_shared
          cc: clang-18
          cxx: clang++-18
        - name: linux-gcc14-libstdcxx
          os: ubuntu-24.04
          packages: g++-14
          arguments: --toolchain=gcc
          cc: gcc-14
          cxx: g++-14
        - name: macos-apple-clang
          os: macos-14
          arguments: --toolchain=xcode
          cc: clang
          cxx: clang++
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux toolchain
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: '3.1.1'
    # C++23 is required; module results are recorded until a supported matrix is established.
    - name: Probe toolchain
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: xmake check-toolchain ${{ matrix.arguments }} --require=cpp23
    - name: Upload capability reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: toolchain-${{ matrix.name }}
        path: |
          build/toolchain-check/**/*.json
          build/toolchain-check/**/*.log
        if-no-files-found: warn

